<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>FRDR Encryption Application</title>
  <script>window.jQuery = window.$ = require('jquery'); </script>
  <script src="../assests/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../assests/css/bootstrap.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/bootstrap-theme.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/frdr-theme.css" type="text/css" />
  <link rel="stylesheet" href="../assests/fonts/fontawesome-5.15.4/css/all.min.css" type="text/css" />
  <script src="../assests/js/jquery_i18n/CLDRPluralRuleParser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.messagestore.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.fallbacks.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.language.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.parser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.bidi.js"></script>
</head>

<body>
  <!--Navigation bar-->
  <div id="nav-placeholder">
  </div>

  <script>
  $(function(){
    $("#nav-placeholder").load("../components/navbar-limited.html");
  });
  </script>
  <!--end of Navigation bar-->
  
  <div class="container">
    <h2 data-i18n="app-import-key-title"></h2> 

    <div class="alert alert-info">
      <p class="mb-1" data-i18n="app-import-key-info"></p>
    </div>

    <h4 class="mt-4 mb-3" data-i18n="app-import-key-options-title"></h4>

    <div id="importAccordion">

      <!-- Option 1: Import from Protected ZIP (open by default) -->
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between alert-success"
             data-toggle="collapse"
             data-target="#collapseZip"
             aria-expanded="true"
             aria-controls="collapseZip"
             style="cursor: pointer;">
          <div class="d-flex align-items-center">
            <i class="fas fa-upload mr-2 text-success"></i>
            <strong data-i18n="app-import-key-from-zip"></strong>
          </div>
          <div class="d-flex align-items-center">
            <span class="badge badge-success mr-3" data-i18n="app-import-key-recommended-badge"></span>
            <i class="fas fa-chevron-up chevron-icon"></i>
          </div>
        </div>
        <div id="collapseZip" class="collapse show">
          <div class="card-body">
            <p class="text-muted" data-i18n="app-import-key-from-zip-desc"></p>
            <button class="btn btn-secondary btn-block" type="button" id="import-from-zip-btn">
              <i class="fas fa-upload mr-2"></i>
              <span data-i18n="app-import-key-select-and-import-zip"></span>
            </button>
            <div class="alert alert-success mt-3 mb-0">
              <strong data-i18n="app-import-key-why-recommended-title"></strong>
              <ul class="mb-0 mt-1 pl-4">
                <li data-i18n="app-import-key-why-recommended-1"></li>
                <li data-i18n="app-import-key-why-recommended-2"></li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Option 2: Import from PEM File (collapsed by default) -->
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between"
             data-toggle="collapse"
             data-target="#collapseFile"
             aria-expanded="false"
             aria-controls="collapseFile"
             style="cursor: pointer;">
          <div class="d-flex align-items-center">
            <i class="fas fa-file-alt mr-2"></i>
            <span data-i18n="app-import-key-from-file"></span>
          </div>
          <i class="fas fa-chevron-down chevron-icon"></i>
        </div>
        <div id="collapseFile" class="collapse">
          <div class="card-body">
            <p class="text-muted" data-i18n="app-import-key-from-file-desc"></p>
            <button class="btn btn-secondary btn-block" type="button" id="import-from-file-btn">
              <i class="fas fa-file-alt mr-2"></i>
              <span data-i18n="app-import-key-select-and-import-file"></span>
            </button>
            <p class="mt-2 mb-0 font-weight-bold text-success" id="selected-file-path"></p>
          </div>
        </div>
      </div>

      <!-- Option 3: Import from Text (collapsed by default) -->
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between"
             data-toggle="collapse"
             data-target="#collapseText"
             aria-expanded="false"
             aria-controls="collapseText"
             style="cursor: pointer;">
          <div class="d-flex align-items-center">
            <i class="fas fa-font mr-2"></i>
            <span data-i18n="app-import-key-from-text"></span>
          </div>
          <i class="fas fa-chevron-down chevron-icon"></i>
        </div>
        <div id="collapseText" class="collapse">
          <div class="card-body">
            <p class="text-muted mb-1" data-i18n="app-import-key-from-text-desc"></p>
            <p class="mb-3">
              <strong class="text-danger" data-i18n="app-import-key-from-text-warning"></strong>
            </p>
            <label data-i18n="app-import-key-text-label"></label>
            <textarea
              class="form-control"
              id="key-text-input"
              rows="6"
              data-i18n="[placeholder]app-import-key-text-placeholder"
            ></textarea>
            <div class="mt-3">
              <button class="btn btn-primary mr-2" type="button" id="import-from-text-btn"
                      data-i18n="app-import-key-import-from-text"></button>
              <button class="btn btn-secondary" type="button" id="clear-text-btn"
                      data-i18n="app-import-key-clear"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Cancel Button -->
    <div class="button mt-4">
      <button class="btn btn-secondary" id="cancel-import-btn" data-i18n="app-import-key-cancel">
      </button>
    </div>
  </div>

  <!-- Password Modal for ZIP -->
  <div class="modal fade" id="zipPasswordModal" tabindex="-1" role="dialog" aria-labelledby="zipPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="zipPasswordModalLabel" data-i18n="app-import-key-zip-password-title"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p data-i18n="app-import-key-zip-password-desc">
          </p>
          
          <div class="form-group">
            <label for="zip-password" data-i18n="app-import-key-zip-password-label"></label>
            <input 
              type="password" 
              class="form-control" 
              id="zip-password" 
              data-i18n="[placeholder]app-import-key-zip-password-placeholder"
            >
          </div>

          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="show-zip-password-checkbox">
            <label class="custom-control-label" for="show-zip-password-checkbox" data-i18n="app-import-key-show-password">
            </label>
          </div>

          <!-- Error message area -->
          <div id="zip-modal-error-message" class="alert alert-danger mt-3" role="alert" style="display: none;">
            <span id="zip-modal-error-text"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" data-i18n="app-import-key-zip-cancel">
          </button>
          <button type="button" class="btn btn-success" id="confirm-import-zip-btn" data-i18n="app-import-key-zip-import">
          </button>
        </div>
      </div>
    </div>
  </div>

  <!--Footer-->
  <div id="footer-placeholder"></div>
  <script>
  $(function(){
    $("#footer-placeholder").load("../components/footer.html");
  });
  </script>
  <!--end of Footer-->  

  <script>
    $('#collapseZip, #collapseFile, #collapseText').on('show.bs.collapse', function () {
      $(this).prev('.card-header').find('.chevron-icon')
        .removeClass('fa-chevron-down').addClass('fa-chevron-up');
    }).on('hide.bs.collapse', function () {
      $(this).prev('.card-header').find('.chevron-icon')
        .removeClass('fa-chevron-up').addClass('fa-chevron-down');
    });
  </script>

  <script src="../renderer_process/import_private_key.js" charset="utf-8"></script>

</body>

</html>
