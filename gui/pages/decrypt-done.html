<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>FRDR Encryption Application</title>
  <script>window.jQuery = window.$ = require('jquery'); </script>
  <script src="../assests/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../assests/css/bootstrap.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/bootstrap-theme.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/frdr-theme.css" type="text/css" />
  <script src="../assests/js/jquery_i18n/CLDRPluralRuleParser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.messagestore.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.fallbacks.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.language.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.parser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.bidi.js"></script>
</head>

<body>
  <!--Navigation bar-->
  <div id="nav-placeholder"></div>
  <script>
    $(function () {
      $("#nav-placeholder").load("../components/navbar.html");
    });
  </script>
  <!--end of Navigation bar-->

  <div class="container">
    <h2 data-i18n="app-decrypt-done-title"></h2>
    <p data-i18n="app-decrypt-done-text1"></p>

    <hr/>

    <h4 data-i18n="app-decrypt-survey-title"></h4>
    <p data-i18n="app-decrypt-survey-text"></p>
    <p id="survey-link-container">
      <a id="survey-link" href="#" data-i18n="app-decrypt-survey-link-label"></a>
    </p>
  </div>

  <!--Footer-->
  <div id="footer-placeholder"></div>
  <script>
    $(function () {
      $("#footer-placeholder").load("../components/footer.html");
    });
  </script>
  <!--end of Footer-->

  <script src="../renderer_process/decrypt.js" charset="utf-8"></script>
  <script>
    $(function () {
      const { shell } = require('electron');
      const path = require('path');
      const fs = require('fs');
      const yaml = require('js-yaml');

      // Read survey URL lazily on click so that i18n locale is fully initialized
      $('#survey-link').on('click', function (e) {
        e.preventDefault();

        var surveyURL = "";
        try {
          var configPath = "";
          if (process.env.NODE_ENV == "development") {
            configPath = path.join(__dirname, '..', '..', 'config', 'config.yml');
          } else if (process.platform === 'win32') {
            configPath = path.join(__dirname, '..', 'app_gui', 'config', 'config.yml');
          } else {
            configPath = path.join(__dirname, '..', 'app_gui', '_internal', 'config', 'config.yml');
          }
          let fileContents = fs.readFileSync(configPath, 'utf8');
          let config = yaml.load(fileContents);

          const lang = $.i18n().locale.startsWith('fr') ? 'fr' : 'en';
          surveyURL = lang === 'fr' ? config["FRDR_SURVEY_URL_FR"] : config["FRDR_SURVEY_URL_EN"];
        } catch (e) {
          console.log(e);
        }

        if (surveyURL) {
          shell.openExternal(surveyURL);
        }
      });
    });
  </script>

</body>

</html>
