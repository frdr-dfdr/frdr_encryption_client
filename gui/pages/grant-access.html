<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>FRDR Encryption Application</title>
  <script>window.jQuery = window.$ = require('jquery'); </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="../assests/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../assests/css/bootstrap.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/bootstrap-theme.min.css" type="text/css" />
  <link rel="stylesheet" href="../assests/css/frdr-theme.css" type="text/css" />
  <link rel="stylesheet" href="../assests/fonts/fontawesome-5.15.4/css/all.min.css" type="text/css" />
  <script src="../assests/js/jquery_i18n/CLDRPluralRuleParser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.messagestore.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.fallbacks.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.language.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.parser.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.js"></script>
  <script src="../assests/js/jquery_i18n/jquery.i18n.emitter.bidi.js"></script>
</head>


<body>
  <!--Navigation bar-->
  <div id="nav-placeholder">
  </div>

  <script>
  $(function(){
    $("#nav-placeholder").load("../components/navbar.html");
  });
  </script>
  <!--end of Navigation bar-->

  <div class="container pb-5">
    <h2 data-i18n="app-grant-access-title"></h2>
    <p data-i18n="app-grant-access-desc"></p>

    <!-- Loading state -->
    <div id="loading-state" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted" data-i18n="app-grant-access-loading"></p>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="text-center py-4 d-none">
      <p class="text-muted" data-i18n="app-grant-access-empty"></p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="alert alert-danger d-none">
      <span data-i18n="app-grant-access-load-error"></span>
    </div>

    <!-- Grant access request list -->
    <div id="request-list" class="d-none"></div>
  </div>

  <!-- Please Wait Modal -->
  <div id="pleasewaitmodal" class="modal fade" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content w-100">
        <div class="modal-body text-center p-4">
          <div class="spinner-border text-primary mb-3" role="status"></div>
          <h4 data-i18n="app-grant-access-button-loading"></h4>
        </div>
      </div>
    </div>
  </div>

  <!--Footer-->
  <div id="footer-placeholder"></div>
  <script>
  $(function(){
    $("#footer-placeholder").load("../components/footer.html");
  });
  const path = require('path');
  const fs = require('fs');
  const yaml = require('js-yaml');
  </script>
  <!--end of Footer-->  

  <script src="../renderer_process/grant_access.js" charset="utf-8"></script> 

</body>

</html>
